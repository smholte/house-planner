name: Poly Haven terms (temporary)
on:
  push:
jobs:
  terms:
    if: contains(github.event.head_commit.message, '[ph terms]')
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sSL https://api.github.com/repos/Poly-Haven/Public-API/contents | python3 -c "import sys,json;print([x['name'] for x in json.load(sys.stdin)])"
          curl -sSL https://api.github.com/repos/Poly-Haven/Public-API/readme -H 'Accept: application/vnd.github.raw' | head -60 | cut -c1-400
          echo ---- LICENSE PAGE
          curl -sSL https://polyhaven.com/license | python3 -c "
          import sys,re
          h=sys.stdin.read()
          h=re.sub(r'<(script|style|svg)[^>]*>.*?</\1>','',h,flags=re.S)
          t=re.sub(r'<[^>]+>','\n',h)
          for l in t.split('\n'):
              l=l.strip()
              if len(l)>30: print(l[:400])
          " | head -40
