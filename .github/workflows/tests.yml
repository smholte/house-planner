name: Tests

# Every push and pull request (task 0008). Free here: the repository is public. ~10 min from start to end.
#   - Precheck (~1 min): nothing private in this repository, the app's version, every test file in a group; picks the
#     mode (tools/ci_precheck.py):
#       full   the build and every public test file, in parallel groups (tools/ci_groups.py)
#       docs   only notes changed since a green commit: the build and the web check
#       reuse  a push to main whose tree already ran green (a fast-forward merge of a green branch): nothing again
#   - Build and web check: the public app and the web version; the web version holds no word of the owner's house
#     (the list is the secret HOUSE_WORDS: never written in this repository)
#   - Tests 1 … 10: the test files of each group one after the other (tools/ci_run.py), on the made-up house
# Read the result from a chat: python3 tools/ci_status.py --wait (the private repository's CLAUDE.md, section 5).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # a started run on main is never stopped; on a branch a newer push stops the older run
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read                      # the precheck looks for green runs

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"

jobs:
  precheck:
    name: Precheck (picks the mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      groups: ${{ steps.pre.outputs.groups }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100             # enough to find the green commit this one comes from

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Precheck (tools/ci_precheck.py)
        id: pre
        run: python tools/ci_precheck.py --github --before "${{ github.event.before }}"

  build:
    name: Build and web check
    needs: precheck
    if: ${{ needs.precheck.outputs.mode != 'reuse' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Packages
        run: python -m pip install -q -r tools/requirements-dev.txt

      - name: Build (the public app and the web version, checked for the house's words)
        env:
          HP_SECRET_WORDS: ${{ secrets.HOUSE_WORDS }}
        run: |
          python build.py --no-house | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$HP_SECRET_WORDS" ]; then
            echo "::warning title=House words not set::The secret HOUSE_WORDS is not set here (or this is a pull request from a fork): the web version was not checked for the house's words. Publish web version refuses to publish without it."
          fi

  tests:
    name: Tests ${{ matrix.group.name }}
    needs: precheck
    if: ${{ needs.precheck.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false               # every group reports, also when one fails
      matrix:
        group: ${{ fromJSON(needs.precheck.outputs.groups) }}
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Packages
        run: python -m pip install -q -r tools/requirements-dev.txt

      - name: Chromium from the cache (by the Playwright version)
        id: cache-pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/requirements-dev.txt') }}

      - name: Chromium (download only when not cached) and its system libraries
        run: |
          if [ "${{ steps.cache-pw.outputs.cache-hit }}" != "true" ]; then python -m playwright install chromium; fi
          python -m playwright install-deps chromium

      - name: Build
        env:
          HP_SECRET_WORDS: ${{ secrets.HOUSE_WORDS }}
        run: python build.py --no-house

      - name: Test files of group ${{ matrix.group.name }} (~${{ matrix.group.minutes }} min)
        env:
          HP_SECRET_WORDS: ${{ secrets.HOUSE_WORDS }}
        run: python tools/ci_run.py ${{ matrix.group.files }}

      - uses: actions/upload-artifact@v7
        if: failure()                # the screenshots of a failed group
        with:
          name: shots-group-${{ matrix.group.name }}
          path: tests/shots/
          retention-days: 7

      - name: Minutes
        if: always()
        run: |
          awk -v s="$(( $(date +%s) - JOB_T0 ))" 'BEGIN { printf "⏱️ Tests ${{ matrix.group.name }}: %.1f min\n", s / 60 }' | tee -a "$GITHUB_STEP_SUMMARY"
